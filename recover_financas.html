        document.getElementById('btnRecover').addEventListener('click', async () => {
            const btn = document.getElementById('btnRecover');
            const log = document.getElementById('log');
            btn.disabled = true;
            btn.innerText = "Recuperando...";
            log.innerHTML = "Conectando ao banco de dados...<br>";
            
            try {
                const docRef = db.collection('appData').doc('mainData');
                const doc = await docRef.get();
                if (doc.exists) {
                    let data = doc.data();
                    let currentTx = data.transactions || [];
                    
                    let txMap = new Map();
                    currentTx.forEach(t => txMap.set(t.id, t));
                    
                    let added = 0;
                    recoveredTx.forEach(t => {
                        if (!txMap.has(t.id)) {
                            currentTx.push(t);
                            added++;
                        }
                    });
                    
                    data.transactions = currentTx;
                    await docRef.set(data);
                    
                    log.innerHTML += "<br><span class='success'>âœ… Sucesso!</span><br>";
                    if (added > 0) {
                        log.innerHTML += Foram restauradas <b>\ transaÃ§Ãµes</b> que estavam faltando.<br>;
                    } else {
                        log.innerHTML += Todas as transaÃ§Ãµes do backup jÃ¡ estavam presentes. Nenhuma nova foi adicionada.<br>;
                    }
                    log.innerHTML += "<br>VocÃª jÃ¡ pode fechar esta pÃ¡gina e abrir o aplicativo normalmente!";
                    btn.innerText = "ConcluÃ­do";
                } else {
                    log.innerHTML += "<span class='error'>Erro: Banco de dados nÃ£o encontrado!</span>";
                    btn.innerText = "Erro";
                }
            } catch (e) {
                log.innerHTML += "<span class='error'>Erro: " + e.message + "</span>";
